<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">

    <title>SmartForm Filler</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink: #14201f;
            --muted: #5d6b69;
            --line: #e2e8e7;
            --teal: #0f766e;
            --teal-soft: #e6f4f2;
            --amber: #8a5a00;
            --amber-soft: #fdf3dc;
            --red: #a32d2d;
            --grey: #eef1f1;
            --white: #ffffff;
            --background: #f8faf9;
            --radius: 9px;
            --shadow: 0 2px 8px rgba(20, 32, 31, 0.045);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            width: 380px;
            min-height: 200px;
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont,
                "Segoe UI", sans-serif;
            font-size: 12px;
            line-height: 1.5;
            color: var(--ink);
            background: var(--white);
            -webkit-font-smoothing: antialiased;
        }

        button, select {
            font: inherit;
        }

        button, a, select {
            -webkit-tap-highlight-color: transparent;
        }

        [hidden] {
            display: none !important;
        }

        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 59px;
            padding: 11px 16px;
            background: var(--white);
            border-bottom: 1px solid var(--line);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 9px;
            color: var(--ink);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .brand img {
            width: 27px;
            height: 27px;
            object-fit: contain;
            border-radius: 6px;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 25px;
            padding: 4px 10px;
            border-radius: 999px;
            background: var(--grey);
            color: var(--muted);
            font-size: 10px;
            font-weight: 600;
            white-space: nowrap;
        }

        .pill::before {
            content: "";
            width: 6px;
            height: 6px;
            flex-shrink: 0;
            border-radius: 50%;
            background: currentColor;
        }

        .pill.ok {
            background: var(--teal-soft);
            color: var(--teal);
        }

        .pill.done {
            background: var(--teal);
            color: var(--white);
        }

        .pill.warn {
            background: var(--amber-soft);
            color: var(--amber);
        }

        .profile {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 55px;
            padding: 9px 16px;
            background: var(--background);
            border-bottom: 1px solid var(--line);
        }

        .profile label {
            flex-shrink: 0;
            color: var(--muted);
            font-size: 11px;
            font-weight: 600;
        }

        .profile select {
            flex: 1;
            min-width: 0;
            height: 34px;
            padding: 0 10px;
            border: 1px solid #cfd8d6;
            border-radius: 7px;
            background: var(--white);
            color: var(--ink);
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .profile select:hover {
            border-color: #aebdb9;
        }

        .profile select:focus {
            outline: none;
            border-color: var(--teal);
            box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.09);
        }

        .chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 25px;
            padding: 3px 8px;
            border-radius: 20px;
            background: var(--grey);
            color: var(--muted);
            font-size: 10px;
            font-weight: 600;
            white-space: nowrap;
        }

        .chip.ok {
            background: var(--teal-soft);
            color: var(--teal);
        }

        #body {
            max-height: 350px;
            min-height: 100px;
            padding: 14px 16px;
            overflow-y: auto;
            overscroll-behavior: contain;
        }

        .empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 145px;
            padding: 22px 15px;
            color: var(--muted);
            font-size: 11px;
            text-align: center;
        }

        .card {
            margin-bottom: 11px;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--white);
            box-shadow: var(--shadow);
        }

        .card:last-child {
            margin-bottom: 0;
        }

        .card h3 {
            margin: 0;
            padding: 10px 12px;
            background: var(--background);
            border-bottom: 1px solid var(--line);
            color: var(--ink);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: -0.1px;
        }

        .card .sub {
            padding: 7px 12px;
            border-bottom: 1px solid var(--line);
            color: var(--muted);
            font-size: 10px;
            line-height: 1.6;
        }

        .row {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            padding: 8px 12px;
            border-top: 1px solid #f0f3f2;
        }

        .row:first-of-type {
            border-top: 0;
        }

        .dot {
            display: grid;
            place-items: center;
            width: 17px;
            height: 17px;
            flex: 0 0 17px;
            margin-top: 1px;
            border-radius: 50%;
            background: var(--teal-soft);
            color: var(--teal);
            font-size: 10px;
            font-weight: 700;
        }

        .row.review .dot {
            background: var(--amber-soft);
            color: var(--amber);
        }

        .row.fail .dot {
            background: #fbe4e4;
            color: var(--red);
        }

        .row.done .dot {
            background: var(--teal);
            color: var(--white);
        }

        .lbl {
            flex: 1;
            min-width: 0;
            color: var(--ink);
            font-size: 11px;
            font-weight: 500;
            overflow-wrap: anywhere;
            line-height: 1.5;
        }

        .key {
            flex-shrink: 0;
            max-width: 125px;
            color: var(--muted);
            font-size: 10px;
            font-weight: 500;
            text-align: right;
            white-space: normal;
            overflow-wrap: anywhere;
        }

        .actions {
            padding: 13px 16px 12px;
            background: var(--white);
            border-top: 1px solid var(--line);
        }

        button.primary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            min-height: 40px;
            padding: 10px 14px;
            border: 1px solid var(--teal);
            border-radius: 8px;
            background: var(--teal);
            color: var(--white);
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            transition: background 0.2s ease,
                box-shadow 0.2s ease,
                transform 0.2s ease;
        }

        button.primary:hover:not(:disabled) {
            background: #0c625b;
            border-color: #0c625b;
            box-shadow: 0 3px 9px rgba(15, 118, 110, 0.17);
        }

        button.primary:active:not(:disabled) {
            transform: translateY(1px);
        }

        button.primary:disabled {
            background: #b9c4c2;
            border-color: #b9c4c2;
            color: #fff;
            cursor: not-allowed;
            box-shadow: none;
        }

        .foot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px 13px;
            background: var(--white);
        }

        .foot a {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: var(--teal);
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: opacity 0.2s ease;
        }

        .foot a:hover {
            opacity: 0.75;
            text-decoration: underline;
        }

        #body::-webkit-scrollbar {
            width: 5px;
        }

        #body::-webkit-scrollbar-track {
            background: transparent;
        }

        #body::-webkit-scrollbar-thumb {
            background: #cbd5d3;
            border-radius: 20px;
        }

        #body::-webkit-scrollbar-thumb:hover {
            background: #aab9b5;
        }

        button:focus-visible,
        select:focus-visible,
        a:focus-visible {
            outline: 2px solid var(--teal);
            outline-offset: 3px;
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <header class="top">
        <div class="brand">
            <img
                src="icons/icon48.png"
                alt="SmartForm Filler logo">
            <span>SmartForm Filler</span>
        </div>

        <span
            id="pill"
            class="pill"
            role="status"
            aria-live="polite">
            Checking
        </span>
    </header>

    <div class="profile">
        <label for="prof">Profile</label>

        <select id="prof" aria-label="Select active profile">
        </select>

        <span
            id="photo"
            class="chip"
            aria-live="polite">
        </span>
    </div>

    <div
        id="body"
        role="region"
        aria-label="Detected form fields"
        aria-live="polite">
    </div>

    <div class="actions">
        <button
            type="button"
            id="fill"
            class="primary"
            disabled>
            Fill form
        </button>
    </div>

    <footer class="foot">
        <a id="opts" href="#">
            Edit profile
        </a>

        <a id="rescan" href="#">
            Scan again
        </a>
    </footer>

    <script src="popup.js"></script>

</body>
</html>
